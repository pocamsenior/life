<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Shared with you</title>
<style>
  :root{--page:#0b0b0d;--side:#0f0f12;--line:#1e1e22;--line2:#2a2a30;--ink:#f2f2f4;--soft:#c3c3c8;--muted:#8a8a92;--faint:#6a6a72;--red:#ff6b6b;--c:#ffad87}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
  main{max-width:760px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 80px}
  .crumb{font-size:12px;color:var(--muted)}
  h1{font-size:28px;line-height:1.15;margin:4px 0 2px}
  .sub{font-size:13px;color:var(--muted)}
  .tabs{display:flex;flex-wrap:wrap;gap:4px 18px;border-bottom:1px solid var(--line2);margin:16px 0 4px}
  .tabs span{font-weight:600;font-size:14px;color:var(--muted);padding:0 0 6px;cursor:pointer}
  .tabs span.on{color:var(--c);border-bottom:2px solid var(--c)}
  .sec{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;border-bottom:1px solid var(--line2);padding:20px 0 6px}
  .sec b{font-size:16px}
  .caps{font:700 11px/1.3 -apple-system,Helvetica,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .act{color:var(--c);cursor:pointer}
  .row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .row .t{font-weight:500}
  .row .l{font-size:13px;color:var(--muted)}
  .acts{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:flex-end;align-items:center}
  .sq{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:2px;vertical-align:middle}
  .lv{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
  .lv .caps{width:110px;flex:none;white-space:normal;padding-top:3px}
  .empty{color:var(--faint);font-size:13px;padding:10px 0}
  .new{color:var(--c);font-size:13px;padding:10px 0 0}
  input,textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line2);color:var(--ink);font:inherit;padding:8px 0;outline:none;border-radius:0}
  input:focus,textarea:focus{border-bottom-color:var(--c)}
  textarea{resize:none;min-height:38px;overflow:hidden}
  .t,.l,.cmt>div{white-space:pre-wrap}
  .form{padding:8px 0 4px;display:flex;flex-direction:column;gap:8px}
  .btn{display:inline-block;border:1px solid var(--line2);color:var(--ink);padding:8px 14px;border-radius:3px;font-size:13px;cursor:pointer;background:transparent}
  .btn.fill{background:var(--ink);color:var(--page);font-weight:700;border-color:var(--ink)}
  .thread{padding:4px 0 8px 14px}
  .cmt{padding:6px 0;border-bottom:1px solid var(--line)}
  .cmt .who{font:700 11px Helvetica,sans-serif;letter-spacing:.1em;text-transform:uppercase}
  .cmt.reply{margin-left:18px}
  .center{padding:60px 0 20px}
  .note{color:var(--muted);font-size:13px;margin-top:14px;max-width:440px}
  .note.wide{max-width:none}
  .choice{color:var(--soft);border-bottom:1px dotted var(--faint);cursor:pointer;margin-right:12px}
  .choice.on{color:var(--c);font-weight:700;border-bottom:1px solid var(--c)}
  .err{color:var(--red);font-size:13px;padding:8px 0}
  #signin,#signout{margin-top:18px}
  .hide{display:none}
  .veil{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .pop{width:100%;max-width:440px;background:#16161a;border:1px solid var(--line2);border-radius:10px;padding:20px 24px 22px}
  .pop .place{font-size:11px;color:var(--muted)}
  .pop .ttl{font-size:18px;font-weight:700;border-bottom:1px solid var(--c);padding-bottom:6px;margin-bottom:10px}
  .pop .hint{color:var(--muted);font-size:13px;margin:4px 0 10px}
  .pop .two{display:flex;gap:10px;margin-top:16px}
  .pop .two .btn{flex:1;text-align:center}
</style>
</head>
<body>
<main id="app">
  <div class="center">
    <div class="sub" id="lead">Loading…</div>
    <div id="signin"></div>
    <div class="note" id="signnote"></div>
  </div>
</main>
<div id="signout" class="hide"></div>
<script src="/life/key.js"></script>
<script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
<script>
"use strict";
// Life · the page friends use for a shared trip, music project or plan (U171).
// Everything lives in the owner's iCloud (CloudKit sharing); this page keeps nothing of its own.
// The link carries the web key and the share: #k=<web key>&s=<share id>&e=<production|development>
const CONTAINER = "iCloud.com.pocamsenior.life";
// Short links: #<share>/<trip name>/<who shared it>; older links used #k=…&s=…&t=…
const H = location.hash.slice(1);
const P = H.includes("=") ? Object.fromEntries(new URLSearchParams(H)) : (() => { const [s, t, n] = H.split("/").map(x => { try { return decodeURIComponent(x || ""); } catch (e) { return x || ""; } }); return { s, t, n }; })();
const STORE = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
let share = (P.s || "").replace(/^.*\/share\//, "").replace(/#.*$/, "");
// Links: pocamsenior.github.io/life/trips/lisbon, /life/music/night-drive, /life/plan/game-night (looked up in the owner's public iCloud)
const slug = (() => { const m = decodeURIComponent(location.pathname).replace(/\/+$/, "").match(/^\/life\/(trips|music|plan)\/([^/]+)$/); return m ? m[1] + "." + m[2].toLowerCase() : ""; })();
const env = P.e || "production";
const key = (window.LIFE_KEY || "").trim() || P.k || STORE("life.k");
if (P.k) STORE("life.k", P.k);
const HUB = { trip: "#ffad87", project: "#ffc21a", plan: "#4c7dff" };
const PEOPLE = ["#5edadb", "#e57fdd", "#8cda8f", "#deceff", "#e0e77d", "#ffadd2", "#aef2ff", "#80bdfb"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function color(name) { let h = 5381; for (const ch of String(name).toLowerCase()) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return PEOPLE[Math.abs(h) % PEOPLE.length]; }
const REF = 978307200; // Apple's dates count from 2001
const toDate = v => v == null ? null : new Date((v + REF) * 1000);
const fmt = d => d ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
const fv = (f, k) => { const x = f && f[k]; if (!x) return ""; if (x.t === "l") return x.v; if (x.t === "d") return toDate(x.v); return x.v; };
const txt = (f, k) => { const v = fv(f, k); return Array.isArray(v) ? v.join(", ") : (v instanceof Date ? fmt(v) : String(v ?? "")); };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).toUpperCase();
const b64e = s => { const b = new TextEncoder().encode(s); let x = ""; b.forEach(c => x += String.fromCharCode(c)); return btoa(x); };
const b64d = s => { const x = atob(s); const b = new Uint8Array(x.length); for (let i = 0; i < x.length; i++) b[i] = x.charCodeAt(i); return new TextDecoder().decode(b); };

let C, DB, zoneID, me = STORE("life.name") || "", state = { fields: {}, checks: {}, entries: {}, recs: {} }, tab = STORE("life.tab") || "", open = {}, loaded = false, seen = +(STORE("life.seen." + share) || 0);

function fail(m) { $("#app").innerHTML = `<div class="center"><div class="err">${esc(m)}</div><div class="note">Ask whoever shared it to send the link again.</div></div>`; }

// U183 · a friend's own page: /life/share-sheet/<name-code>[/tab]
const SHEET = (() => { const m = decodeURIComponent(location.pathname).replace(/\/+$/, "").match(/^\/life\/share-sheet\/([^/]+)(?:\/([^/]+))?$/); return m ? { code: m[1].toLowerCase(), tab: m[2] || "" } : null; })();
if (!key) fail("This page isn't set up yet (its web key is missing).");
else if (SHEET) sheetStart();
else if (!share && !slug) fail("This link is missing part of it.");
else start();

// ---------- a friend's own page (U183) ----------
let sheetRec = null, sheetTab = "";
function sheetStart() {
  CloudKit.configure({ containers: [{ containerIdentifier: CONTAINER, environment: env,
    apiTokenAuth: { apiToken: key, persist: true, signInButton: { id: "signin", theme: "white" }, signOutButton: { id: "signout", theme: "black" } } }] });
  C = CloudKit.getDefaultContainer();
  pubGetC("sheet." + SHEET.code).then(rec => {
    if (!rec) return fail("This link doesn't work anymore. Ask for a new one.");
    sheetRec = rec;
    const v = k => rec.fields[k] ? rec.fields[k].value : "";
    document.title = "Shared with " + (v("name") || "you");
    C.setUpAuth().then(u => u ? sheetReady() : sheetSignIn()).catch(e => fail("Couldn't reach iCloud: " + (e.reason || e.message || e)));
  }).catch(e => fail("Couldn't reach iCloud: " + (e.reason || e.message || e)));
}
async function pubGetC(name) { const r = await C.publicCloudDatabase.fetchRecords([{ recordName: name }]); const x = r.records && r.records[0]; return x && !x.serverErrorCode ? x : null; }
function sheetSignIn() {
  const v = k => sheetRec.fields[k] ? sheetRec.fields[k].value : "";
  $("#lead").innerHTML = `<h1>Shared with ${esc(v("name") || "you")}</h1><div class="sub">From ${esc(v("owner") || "a friend")}</div>`;
  $("#signnote").textContent = "Sign in with your Apple ID to see everything shared with you. The first Apple ID to sign in here makes this link yours.";
  C.whenUserSignsIn().then(sheetReady).catch(e => fail(e.reason || e.message || String(e)));
}
async function sheetReady() {
  try { const id = await C.fetchCurrentUserIdentity(); myID = (id && id.userRecordName) || ""; const n = id && id.nameComponents; if (!me && n && n.givenName) { me = n.givenName; STORE("life.name", me); } } catch (e) { }
  const v = k => sheetRec.fields[k] ? sheetRec.fields[k].value : "";
  const owner = v("uid");
  if (owner && owner !== myID) {
    try { await C.publicCloudDatabase.saveRecords([{ recordType: "SheetClaim", recordName: "try." + SHEET.code, fields: { code: { value: SHEET.code }, uid: { value: myID }, name: { value: me }, status: { value: "try" } } }]); } catch (e) { }
    $("#app").innerHTML = `<div class="center"><h1>This link is someone else's</h1><div class="note">Nothing of theirs shows here. Ask ${esc(v("owner") || "the person who shares with you")} for your own link.</div></div>`;
    return;
  }
  if (!owner) {
    // the first sign-in makes it yours (Life links you to your contact on its next sync)
    const mine = await pubGetC("claim." + SHEET.code);
    if (!mine) { try { await C.publicCloudDatabase.saveRecords([{ recordType: "SheetClaim", recordName: "claim." + SHEET.code, fields: { code: { value: SHEET.code }, uid: { value: myID }, name: { value: me }, status: { value: "claim" } } }]); } catch (e) { } }
    else if (mine.fields.uid && mine.fields.uid.value !== myID) { $("#app").innerHTML = `<div class="center"><h1>This link is someone else's</h1><div class="note">Ask ${esc(v("owner") || "them")} for your own link.</div></div>`; return; }
  }
  sheetRender();
  setInterval(async () => { const r = await pubGetC("sheet." + SHEET.code).catch(() => null); if (r) { sheetRec = r; sheetRender(); } }, 60000);
}
function sheetRender() {
  const v = k => sheetRec.fields[k] ? sheetRec.fields[k].value : "";
  let items = []; try { items = JSON.parse(v("items") || "[]"); } catch (e) { }
  const hidden = new Set(JSON.parse(STORE("life.pass." + SHEET.code) || "[]"));
  items = items.filter(x => !hidden.has(x.g));
  const invited = items.filter(x => x.st === "invited");
  const kinds = { Trips: "trip", Music: "project", Plans: "plan" };
  const tabs = [...(invited.length ? ["Invited"] : []), ...Object.keys(kinds).filter(t => items.some(x => x.k === kinds[t] && x.st === "in"))];
  sheetTab = SHEET.tab ? SHEET.tab.charAt(0).toUpperCase() + SHEET.tab.slice(1) : (sheetTab || STORE("life.sheetTab." + SHEET.code) || tabs[0]);
  if (!tabs.includes(sheetTab)) sheetTab = tabs[0];
  document.documentElement.style.setProperty("--c", sheetTab === "Music" ? HUB.project : sheetTab === "Plans" ? HUB.plan : HUB.trip);
  const only = Object.keys(kinds).filter(t => tabs.includes(t));
  let h = `<div class="crumb">From ${esc(v("owner") || "a friend")}</div><h1>Shared with ${esc(v("name") || "you")}</h1>`;
  if (only.length === 1 && !invited.length) h += `<div class="sub">${only[0]} only</div>`;
  if (tabs.length > 1) h += `<div class="tabs">${tabs.map(t => `<span class="${t === sheetTab ? "on" : ""}" data-stab="${t}">${t}${t === "Invited" ? " " + invited.length : ""}</span>`).join("")}</div>`;
  if (!items.length) h += `<div class="empty" style="padding-top:20px">Nothing shared with you yet. Things show here as soon as they're shared.</div>`;
  const row = x => {
    const link = x.s && x.s.includes("/") ? "/life/" + x.s : "/life/#" + x.g;
    const bits = [x.when, x.r, x.todo ? x.todo + " to-do" + (x.todo === "1" ? "" : "s") : ""].filter(Boolean).join(" · ");
    if (x.st === "invited") return `<div class="row"><div><div class="t">${esc(x.t)}</div><div class="l">${esc({ trip: "Trip", project: "Music project", plan: "Plan" }[x.k] || "")}${bits ? " · " + esc(bits) : ""}</div></div><div class="acts"><a class="btn fill" href="${esc(link)}" style="text-decoration:none">Join</a><span class="caps act" style="color:var(--muted)" data-pass="${esc(x.g)}">Not for me</span></div></div>`;
    return `<a href="${esc(link)}" style="color:inherit;text-decoration:none"><div class="row"><div><div class="t">${esc(x.t)}</div><div class="l">${esc(bits)}</div></div><div class="caps">Open ›</div></div></a>`;
  };
  if (sheetTab === "Invited") h += sec("Invited") + invited.map(row).join("") + `<div class="note">Join opens it right away: ${esc(v("owner") || "they")} picked you.</div>`;
  else if (sheetTab) {
    const list = items.filter(x => x.k === kinds[sheetTab] && x.st === "in"), now_ = list.filter(x => !x.past), past = list.filter(x => x.past);
    h += now_.map(row).join("") || `<div class="empty">Nothing here now.</div>`;
    if (past.length) h += sec("Past") + past.map(row).join("");
  }
  h += `<div class="note wide" style="margin-top:28px">Keep this page: add it to your Home Screen (Share › Add to Home Screen) and everything shared with you is one tap away.</div>`;
  $("#app").innerHTML = h;
}
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-stab],[data-pass]"); if (!t) return;
  if (t.dataset.stab) { sheetTab = t.dataset.stab; STORE("life.sheetTab." + SHEET.code, sheetTab); history.replaceState(null, "", "/life/share-sheet/" + SHEET.code + "/" + sheetTab.toLowerCase()); SHEET.tab = ""; sheetRender(); }
  else if (t.dataset.pass) {
    const g = t.dataset.pass;
    try { await C.publicCloudDatabase.saveRecords([{ recordType: "SheetClaim", recordName: "pass." + SHEET.code + "." + g, fields: { code: { value: SHEET.code }, uid: { value: myID }, name: { value: me }, status: { value: "pass" } } }]); } catch (e) { }
    const s = new Set(JSON.parse(STORE("life.pass." + SHEET.code) || "[]")); s.add(g); STORE("life.pass." + SHEET.code, JSON.stringify([...s])); sheetRender();
  }
});

function start() {
  CloudKit.configure({ containers: [{ containerIdentifier: CONTAINER, environment: env,
    apiTokenAuth: { apiToken: key, persist: true, signInButton: { id: "signin", theme: "white" }, signOutButton: { id: "signout", theme: "black" } } }] });
  C = CloudKit.getDefaultContainer();
  DB = C.sharedCloudDatabase;
  (slug && !share ? lookup() : Promise.resolve()).then(() => C.setUpAuth()).then(u => u ? ready() : askSignIn()).catch(e => fail("Couldn't reach iCloud: " + (e.reason || e.message || e)));
}
async function lookup() {
  const r = await C.publicCloudDatabase.fetchRecords([{ recordName: "link." + slug }]);
  const rec = r.records && r.records[0];
  if (!rec || rec.serverErrorCode || !rec.fields || !rec.fields.guid) throw { reason: "This link isn't shared anymore, or the name is spelled differently." };
  const v = k => rec.fields[k] ? rec.fields[k].value : "";
  share = v("guid"); P.t = v("title"); P.n = v("sharer"); P.y = v("kind"); P.m = v("mode");
  seen = +(STORE("life.seen." + share) || 0);
}
function askSignIn() {
  $("#lead").innerHTML = (P.t ? `<h1>${esc(P.t)}</h1>` : `<h1>Shared with you</h1>`) + (P.n ? `<div class="sub">Shared by ${esc(P.n)}</div>` : "");
  if (P.y && HUB[P.y]) document.documentElement.style.setProperty("--c", HUB[P.y]);
  if (P.t) document.title = P.t;
  $("#signnote").textContent = "Sign in with your Apple ID to see it and add to it. Your name shows next to what you add. No app needed. No Apple ID? You can make one free with any email at appleid.apple.com.";
  C.whenUserSignsIn().then(ready).catch(e => fail(e.reason || e.message || String(e)));
}
let myID = "";
async function ready() {
  $("#app").innerHTML = `<div class="center"><div class="sub">Opening…</div></div>`;
  try { const id = await C.fetchCurrentUserIdentity(); myID = (id && id.userRecordName) || ""; const n = id && id.nameComponents; if (!me && n && n.givenName) { me = n.givenName; STORE("life.name", me); } } catch (e) { }
  try {
    let z = STORE("life.zone." + share);
    if (z) { const o = JSON.parse(z); zoneID = o.zoneID || o; if (o.own) DB = C.privateCloudDatabase; }
    else {
      let m = null, why = "";
      try {
        const r = await C.acceptShares([share]);
        const res = (r && (r.results || r._results)) || [];
        m = res.find(x => x && (x.zoneID || (x.share && x.share.zoneID)));
        if (!m) why = (res[0] && (res[0].reason || res[0].serverErrorCode)) || "";
      } catch (e) { why = e.reason || e.message || String(e); }
      if (m) {
        zoneID = m.zoneID || m.share.zoneID;
        STORE("life.zone." + share, JSON.stringify({ zoneID }));
      } else if (P.z || (zoneID = await ownZone())) {
        // the owner opening their own link: it's in their own iCloud, not shared with them
        DB = C.privateCloudDatabase; zoneID = P.z ? { zoneName: P.z } : zoneID;
        STORE("life.zone." + share, JSON.stringify({ zoneID, own: true }));
      } else return joinFlow();
    }
    try { await pull(); }
    catch (e) {
      const why = e.reason || e.message || String(e);
      if (/owner/i.test(why)) {
        // you shared this yourself: it's in your own iCloud, not shared with you
        DB = C.privateCloudDatabase; zoneID = { zoneName: zoneID.zoneName };
        STORE("life.zone." + share, JSON.stringify({ zoneID, own: true }));
        await pull();
      } else { STORE("life.zone." + share, ""); return joinFlow(); }   // no longer let in
    }
    if (!polling) polling = setInterval(() => pull().catch(() => { STORE("life.zone." + share, ""); clearInterval(polling); polling = null; joinFlow(); }), 60000);
  } catch (e) { STORE("life.zone." + share, ""); fail(e.reason || e.message || String(e)); }
}

// ---------- asking to join (when the owner lets people in) ----------
let polling = null, waiting = null;
async function pubGet(name) { try { const r = await C.publicCloudDatabase.fetchRecords([{ recordName: name }]); const x = r.records && r.records[0]; return x && !x.serverErrorCode ? x : null; } catch (e) { return null; } }
const stamp = x => (x && x.modified && x.modified.timestamp) || 0;
async function joinFlow() {
  clearTimeout(waiting);
  const [req, ans] = await Promise.all([pubGet(`join.${share}.${myID}`), pubGet(`answer.${share}.${myID}`)]);
  const status = ans && ans.fields && ans.fields.status && ans.fields.status.value;
  const head = `<div class="center">${P.t ? `<h1>${esc(P.t)}</h1>` : `<h1>${esc(document.title)}</h1>`}${P.n ? `<div class="sub">Shared by ${esc(P.n)}</div>` : ""}`;
  if (ans && (status === "no" || status === "removed") && (!req || stamp(ans) >= stamp(req))) {
    $("#app").innerHTML = head + `<div class="note">This ${what()} isn't open to you.</div><div style="margin-top:16px"><span class="btn" data-askagain="1">Ask again</span></div></div>`;
    return;
  }
  if (req && (!ans || stamp(req) > stamp(ans))) {
    $("#app").innerHTML = head + `<div class="new" style="padding-top:18px">Asked to join · waiting for ${esc(P.n || "the owner")}</div><div class="note">Keep this page open or come back to the link later; it opens by itself once you're in.</div></div>`;
    waiting = setTimeout(async () => { try { const r = await C.acceptShares([share]); const res = (r && (r.results || r._results)) || []; const m = res.find(x => x && (x.zoneID || (x.share && x.share.zoneID))); if (m) { zoneID = m.zoneID || m.share.zoneID; DB = C.sharedCloudDatabase; STORE("life.zone." + share, JSON.stringify({ zoneID })); return ready(); } } catch (e) { } joinFlow(); }, 20000);
    return;
  }
  $("#app").innerHTML = head + `<div class="form" style="max-width:360px;margin-top:22px"><span class="caps">Your name</span><input id="joinName" placeholder="The name you go by" value="${esc(me)}"><div><span class="btn fill" data-join="1">Ask to join</span></div></div>
    <div class="note">${esc(P.n || "The owner")} lets people in. You'll see the ${what()} here once they do.</div></div>`;
}
function showAsk() {
  const head = `<div class="center">${P.t ? `<h1>${esc(P.t)}</h1>` : ""}${P.n ? `<div class="sub">Shared by ${esc(P.n)}</div>` : ""}`;
  $("#app").innerHTML = head + `<div class="form" style="max-width:360px;margin-top:22px"><span class="caps">Your name</span><input id="joinName" placeholder="The name you go by" value="${esc(me)}"><div><span class="btn fill" data-join="1">Ask to join</span></div></div></div>`;
}
const what = () => ({ trip: "trip", project: "project", plan: "plan" }[P.y] || "share");
const what2 = t => ({ trip: "trip", project: "project", plan: "plan" }[t] || "share");
async function askToJoin() {
  const n = ($("#joinName") && $("#joinName").value.trim()) || me;
  if (!n) { $("#joinName").focus(); return; }

document.addEventListener("input", ev => { const t = ev.target; if (t.tagName === "TEXTAREA") { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; } });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { closePop(); return; }
  if (ev.key !== "Enter" || ev.target.id === "nameIn" || ev.target.tagName === "TEXTAREA") return;
  const c = ev.target.dataset && ev.target.dataset.ctext; if (c) { document.querySelector(`[data-csend="${c}"]`).click(); return; }
  const f = ev.target.closest && ev.target.closest("[data-form]"); if (f) document.querySelector(`[data-post="${f.dataset.form}"]`).click();
});
</script>
</body>
</html>
